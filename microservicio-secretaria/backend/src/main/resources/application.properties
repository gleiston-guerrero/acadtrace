spring.application.name=sga-secretaria-backend
server.port=${PORT:5176}

# --- Base de datos (usada por DataSourceConfig para armar la URL JDBC) ---
db.host=${DB_HOST:192.0.2.1}
db.port=${DB_PORT:5433}
db.name=${DB_NAME:sga}
db.user=${DB_USER:postgres}
db.password=${DB_PASSWORD}
db.ssl=${DB_SSL:false}

# --- JWT (mismo secret que sga-principal) ---
app.jwt.secret=${JWT_SECRET}

# --- Cifrado AES-256-GCM de campos sensibles (direccion/telefono/tipo_discapacidad) ---
app.crypto.secret-key=${AES_SECRET_KEY}

# --- gRPC cliente hacia sga-principal (catalogo: anos lectivos/grados/paralelos/asignaturas) ---
grpc.client.principal-service.address=static://${GRPC_PRINCIPAL_HOST:localhost}:${GRPC_PRINCIPAL_PORT:9092}
grpc.client.principal-service.negotiationType=PLAINTEXT
app.grpc.internal-token=${GRPC_INTERNAL_TOKEN}

# --- CORS ---
app.cors.origin=${CORS_ORIGIN:*}

# --- Institucion (encabezados de PDF) ---
app.institucion.nombre=${INST_NOMBRE:Unidad Educativa}
app.institucion.ciudad=${INST_CIUDAD:Ecuador}

# --- Frontend estatico (client/dist), relativo al working directory del proceso ---
app.frontend.dist-path=${FRONTEND_DIST_PATH:client/dist}

# --- Documentos digitales de matricula (RF-14): almacenamiento en disco ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.uploads-path=${UPLOADS_PATH:uploads}

# --- Jackson: fechas como ISO-8601, no timestamps epoch ---
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.ec.uteq.sga.secretaria=DEBUG

# --- Observabilidad: Prometheus scraping ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
spring.datasource.hikari.maximum-pool-size=60

# --- OpenAPI / Swagger (E4) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/secretario/**
springdoc.packages-to-scan=ec.uteq.sga.secretaria.presentation.controller
springdoc.paths-to-exclude=/error
