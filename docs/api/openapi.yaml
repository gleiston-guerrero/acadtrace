openapi: 3.0.3
info:
  title: AcadTrace - API Gateway & Microservicio Secretaría
  description: |
    Especificación OpenAPI 3.0 para la plataforma de Gestión Académica y Auditoría Criptográfica AcadTrace.
    Incluye endpoints de Secretaría, SGA Principal y Auditoría con control de acceso por tokens JWT HMAC-SHA256
    y propagación de trazas distribuidas mediante encabezado X-Trace-Id.
  version: 4.0.0
  contact:
    name: Equipo BCEL - UTEQ
    url: https://github.com/LEO23as/acadtrace

servers:
  - url: http://localhost:8080
    description: API Gateway HAProxy (Entorno de Desarrollo / Integración Local)
  - url: http://192.0.2.1:8080
    description: Servidor Perimetral AWS EC2 Producción

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de autenticación JWT firmado con HMAC-SHA256.

  parameters:
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      description: Identificador UUID de correlación para observabilidad distribuida.
      schema:
        type: string
        format: uuid

  schemas:
    Estudiante:
      type: object
      properties:
        idEstudiante:
          type: integer
        cedula:
          type: string
          description: Cédula de identidad (cifrada con AES-256-GCM en reposo).
        nombres:
          type: string
        apellidos:
          type: string
        fechaNacimiento:
          type: string
          format: date
        genero:
          type: string
        direccion:
          type: string
        activo:
          type: boolean

    MatriculaRequest:
      type: object
      required:
        - idEstudiante
        - idGrado
        - idPeriodo
      properties:
        idEstudiante:
          type: integer
        idGrado:
          type: integer
        idPeriodo:
          type: integer
        folio:
          type: string

    EventoAcademico:
      type: object
      properties:
        idEvento:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        tipo:
          type: string
          enum: [REUNION, EVALUACION, FERIADO, CIVICO]

    AuditoriaEvento:
      type: object
      properties:
        idAuditoria:
          type: integer
        schemaOrigen:
          type: string
        traceId:
          type: string
          format: uuid
        username:
          type: string
        accion:
          type: string
        tablaAfectada:
          type: string
        registroId:
          type: integer
        descripcion:
          type: string
        resultado:
          type: string
          enum: [EXITO, FALLO]
        hmac:
          type: string
          description: Firma HMAC-SHA256 para verificación de integridad.
        fecha:
          type: string
          format: date-time

paths:
  /api/secretaria/estudiantes:
    get:
      summary: Listar estudiantes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: q
          in: query
          schema:
            type: string
          description: Filtro de búsqueda por nombres o apellidos
      responses:
        '200':
          description: Lista de estudiantes obtenida exitosamente.
        '401':
          description: No autorizado (Token JWT ausente o inválido).

    post:
      summary: Registrar nuevo estudiante
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Estudiante'
      responses:
        '201':
          description: Estudiante creado y evento de auditoría registrado.
        '400':
          description: Datos inválidos.

  /api/secretaria/matriculas:
    post:
      summary: Matricular estudiante en curso y periodo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatriculaRequest'
      responses:
        '201':
          description: Matrícula asentada con folio y reloj de Lamport sincronizado.
        '409':
          description: Conflicto - estudiante ya matriculado en este periodo.

  /api/secretaria/reportes/matricula/{idMatricula}/pdf:
    get:
      summary: Generar acta de matrícula en formato PDF
      security:
        - bearerAuth: []
      parameters:
        - name: idMatricula
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Documento PDF generado con Apache PDFBox.
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/secretaria/eventos:
    get:
      summary: Obtener eventos del calendario académico
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listado de eventos académicos.

  /api/auditoria:
    get:
      summary: Consultar bitácora criptográfica de auditoría
      security:
        - bearerAuth: []
      parameters:
        - name: traceId
          in: query
          schema:
            type: string
            format: uuid
        - name: schemaOrigen
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Registros de auditoría con estado de firma HMAC verificado.

  /actuator/health:
    get:
      summary: Health Check del microservicio
      responses:
        '200':
          description: Servicio saludable (UP).
