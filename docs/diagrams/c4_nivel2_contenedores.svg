<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .boundary { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 5,5; stroke-width: 2; rx: 12; }
      .container-box { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; rx: 6; }
      .container-db { fill: #0d9488; stroke: #0f766e; stroke-width: 2; rx: 6; }
      .container-obs { fill: #d97706; stroke: #b45309; stroke-width: 2; rx: 6; }
      .client-box { fill: #475569; stroke: #334155; stroke-width: 2; rx: 6; }
      .label-white { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .desc-white { font-family: sans-serif; font-size: 9px; fill: #f1f5f9; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); }
      .boundary-title { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #64748b; }
    </style>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <text x="480" y="25" class="title" text-anchor="middle">Diagrama C4 - Nivel 2: Contenedores del SGA Distribuido</text>

  <!-- Clientes -->
  <rect x="40" y="50" width="160" height="55" class="client-box"/>
  <text x="120" y="72" class="label-white">App Móvil Docente</text>
  <text x="120" y="88" class="desc-white">Android Jetpack Room</text>

  <rect x="230" y="50" width="160" height="55" class="client-box"/>
  <text x="310" y="72" class="label-white">Portales Web SPA</text>
  <text x="310" y="88" class="desc-white">Vue.js / HTML5</text>

  <!-- Límite SGA -->
  <rect x="20" y="130" width="920" height="470" class="boundary"/>
  <text x="35" y="150" class="boundary-title">Límite del Sistema Distribuido SGA (Docker Swarm / Compose)</text>

  <!-- Gateway -->
  <rect x="40" y="170" width="880" height="50" class="container-box" style="fill:#1e40af;"/>
  <text x="480" y="192" class="label-white">HAProxy 2.9 (API Gateway &amp; Reverse Proxy &amp; Metrics :8404)</text>
  <text x="480" y="208" class="desc-white">Balanceo Round-Robin, CORS, Enrutamiento REST (:8080, :8081, :8082, :8084) y gRPC TCP (:9092)</text>

  <!-- Microservicios -->
  <rect x="40" y="250" width="160" height="75" class="container-box"/>
  <text x="120" y="275" class="label-white">sga-principal (x2)</text>
  <text x="120" y="292" class="desc-white">Java 21 / Spring Boot</text>
  <text x="120" y="308" class="desc-white">Auth JWT &amp; gRPC :9092</text>

  <rect x="220" y="250" width="160" height="75" class="container-box"/>
  <text x="300" y="275" class="label-white">microservicio-secretaria</text>
  <text x="300" y="292" class="desc-white">Java 21 / Spring Boot</text>
  <text x="300" y="308" class="desc-white">Matrículas &amp; Event Sourcing</text>

  <rect x="400" y="250" width="160" height="75" class="container-box"/>
  <text x="480" y="275" class="label-white">microservicio-docente</text>
  <text x="480" y="292" class="desc-white">Python 3.12 / Django</text>
  <text x="480" y="308" class="desc-white">Asistencia &amp; Notas</text>

  <rect x="580" y="250" width="160" height="75" class="container-box"/>
  <text x="660" y="275" class="label-white">microservicio-soporte</text>
  <text x="660" y="292" class="desc-white">Java 21 / Spring Boot</text>
  <text x="660" y="308" class="desc-white">Helpdesk, RBAC, gRPC :9094</text>

  <rect x="760" y="250" width="160" height="75" class="container-box"/>
  <text x="840" y="275" class="label-white">microservicio-ia</text>
  <text x="840" y="292" class="desc-white">Python FastAPI</text>
  <text x="840" y="308" class="desc-white">Google Gemini 1.5</text>

  <!-- Datos y Consenso -->
  <rect x="130" y="365" width="310" height="70" class="container-db"/>
  <text x="285" y="390" class="label-white">PostgreSQL 16 (AWS EC2)</text>
  <text x="285" y="407" class="desc-white">Multi-Schema: public, secretaria, docente, soporte</text>
  <text x="285" y="420" class="desc-white">Persistencia relacional y atomicidad ACID</text>

  <rect x="520" y="365" width="310" height="70" class="container-db"/>
  <text x="675" y="390" class="label-white">etcd v3.5 (Consenso Raft)</text>
  <text x="675" y="407" class="desc-white">Elección de Líder /sga/leader (Lease 5s)</text>
  <text x="675" y="420" class="desc-white">Coordinación de Tareas Programadas</text>

  <!-- Observabilidad -->
  <rect x="40" y="480" width="260" height="85" class="container-obs"/>
  <text x="170" y="505" class="label-white">Prometheus v2.51</text>
  <text x="170" y="522" class="desc-white">Scrape 15s de Actuators, HAProxy, etcd</text>
  <text x="170" y="538" class="desc-white">Motor de Series Temporales (PromQL)</text>
  <text x="170" y="552" class="desc-white">Remote write a Grafana Cloud</text>

  <rect x="350" y="480" width="260" height="85" class="container-obs"/>
  <text x="480" y="505" class="label-white">cAdvisor v0.49</text>
  <text x="480" y="522" class="desc-white">Métricas de Contenedores Docker</text>
  <text x="480" y="538" class="desc-white">CPU %, RAM MB, Network &amp; Disk I/O</text>
  <text x="480" y="552" class="desc-white">Puerto :8085 (:8080 interno)</text>

  <rect x="660" y="480" width="260" height="85" class="container-obs"/>
  <text x="790" y="505" class="label-white">Grafana v10.4</text>
  <text x="790" y="522" class="desc-white">Tablero de 6 Vistas (pfc-dashboard.json)</text>
  <text x="790" y="538" class="desc-white">Percentiles P50/P95/P99, RPS, Errores 4xx/5xx</text>
  <text x="790" y="552" class="desc-white">Consenso Raft y E2E Móvil</text>

  <!-- Flechas -->
  <path d="M 120 105 L 200 170" class="arrow"/>
  <path d="M 310 105 L 350 170" class="arrow"/>
  <path d="M 200 220 L 120 250" class="arrow"/>
  <path d="M 350 220 L 300 250" class="arrow"/>
  <path d="M 480 220 L 480 250" class="arrow"/>
  <path d="M 600 220 L 660 250" class="arrow"/>
  <path d="M 750 220 L 840 250" class="arrow"/>
  
  <path d="M 200 325 L 250 365" class="arrow"/>
  <path d="M 300 325 L 285 365" class="arrow"/>
  <path d="M 480 325 L 320 365" class="arrow"/>
  <path d="M 660 325 L 350 365" class="arrow"/>
  <path d="M 660 325 L 675 365" class="arrow"/>
</svg>
