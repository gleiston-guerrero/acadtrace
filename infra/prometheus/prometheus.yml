global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ─── Remote write hacia Grafana Cloud ───
# NO subas este bloque con la API key real al repo compartido.
remote_write:
  - url: "https://<TU-PROMETHEUS-URL>.grafana.net/api/prom/push"
    basic_auth:
      username: "<TU_INSTANCE_ID>"
      password: "<TU_API_KEY>"

scrape_configs:
  # Auto-monitoreo: permite consultar metricas internas de Prometheus
  # (ej. prometheus_remote_storage_samples_total) para diagnosticar el
  # remote_write hacia Grafana Cloud.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # sga-principal corre con 2 replicas detras de HAProxy (deploy.replicas: 2 en
  # docker-compose.yml) — se scrapea cada replica por separado (no el puerto de
  # HAProxy) para no mezclar las metricas de las 2 instancias en Grafana.
  - job_name: "sga-principal"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "sga-sistema-distribuido-sga-principal-1:8080"
          - "sga-sistema-distribuido-sga-principal-2:8080"
        labels:
          application: sga-principal

  - job_name: "microservicio-secretaria"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["microservicio-secretaria:5176"]
        labels:
          application: sga-secretaria-backend

  # microservicio-soporte (Java/Spring Boot): ya expone /actuator/prometheus
  # (micrometer-registry-prometheus + management.* en application.properties).
  - job_name: "microservicio-soporte"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["microservicio-soporte:5178"]
        labels:
          application: sga-soporte-backend

  # microservicio-docente (Django): pendiente que su dueño agregue
  # django-prometheus (requirements.txt + INSTALLED_APPS + middleware + urls.py).
  # django-prometheus expone /metrics (no /actuator/prometheus) en el puerto REST interno (8000).
  - job_name: "microservicio-docente"
    metrics_path: /metrics
    static_configs:
      - targets: ["microservicio-docente:8000"]
        labels:
          application: sga-docente

  - job_name: "cadvisor"
    static_configs:
      - targets: ["sga-cadvisor:8080"]

  - job_name: "etcd"
    metrics_path: /metrics
    static_configs:
      - targets: ["etcd:2379"]

  - job_name: "haproxy"
    metrics_path: /metrics
    static_configs:
      - targets: ["sga-haproxy:8404"]