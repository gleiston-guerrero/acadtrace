global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# Resolver DNS interno de Docker. Necesario para que HAProxy arranque
# aunque los backends aun no esten corriendo, y para que re-resuelva
# la IP si un contenedor se reinicia y cambia de direccion.
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold obsolete   10s

# Estadisticas del balanceador
frontend fe_stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats show-legends

# Balanceo REST del sga-principal
frontend fe_principal
    bind *:8080
    mode http
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "*"
    default_backend be_principal

backend be_principal
    mode http
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server-template principal 2 sga-principal:8080 check inter 3s fall 2 rise 2 resolvers docker_dns init-addr none

# Balanceo gRPC (TCP) del sga-principal
frontend fe_principal_grpc
    bind *:9092
    mode tcp
    option tcplog
    default_backend be_principal_grpc

backend be_principal_grpc
    mode tcp
    balance leastconn
    server-template principalgrpc 2 sga-principal:9092 check inter 3s fall 2 rise 2 resolvers docker_dns init-addr none

# Balanceo REST del microservicio-docente
frontend fe_docente
    bind *:8081
    mode http
    default_backend be_docente

backend be_docente
    mode http
    balance roundrobin
    server-template docente 2 microservicio-docente:8000 check inter 3s fall 2 rise 2 resolvers docker_dns init-addr none
