global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# Estadisticas del balanceador
frontend fe_stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats show-legends

# Balanceo REST del sga-principal
frontend fe_principal
    bind *:8080
    mode http
    default_backend be_principal

backend be_principal
    mode http
    balance roundrobin
    option httpchk GET /actuator/health/liveness
    http-check expect status 200
    server-template principal 2 sga-principal:8080 check inter 3s fall 2 rise 2

# Balanceo gRPC (TCP) del sga-principal
frontend fe_principal_grpc
    bind *:9092
    mode tcp
    option tcplog
    default_backend be_principal_grpc

backend be_principal_grpc
    mode tcp
    balance leastconn
    server-template principalgrpc 2 sga-principal:9092 check inter 3s fall 2 rise 2
