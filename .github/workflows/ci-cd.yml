name: CI/CD Pipeline - AcadTrace (Entrega 4)

on:
  push:
    branches:
      - main
      - feature/entrega-4
      - devBedon
      - Ernesto-Luna
      - Juliana-Emanuel
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  ci-docente:
    name: CI Microservicio Docente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Suite, cobertura y comprobaciones Django
        run: |
          cd microservicio-docente
          python -m pip install -r requirements.txt
          python -m pytest -q
          python -m pytest --cov=docentes --cov-report=term-missing --cov-report=html:../docs/cobertura/docente
          python manage.py check --settings=micro_docente.test_settings
          python manage.py makemigrations --check --dry-run --settings=micro_docente.test_settings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-microservicio-docente
          path: docs/cobertura/docente/

  ci-movil-representante:
    name: CI Aplicación Móvil Representante
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tests, JaCoCo, lint y APK debug
        run: |
          cd app-movil-docente
          curl --fail --location --output gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew testDebugUnitTest jacocoTestReport lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-representante-debug
          path: app-movil-docente/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-movil-representante
          path: docs/cobertura/movil/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-movil-representante
          path: app-movil-docente/app/build/reports/lint-results-debug.html

  # ─── 1. JOB LINT ───────────────────────────────────────────────────────────
  lint:
    name: 1. Lint y Análisis Estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxis Python en microservicio-docente
        run: |
          python -m pip install --upgrade pip flake8
          flake8 microservicio-docente/docentes --count --select=E9,F63,F7,F82 --show-source --statistics

  # ─── 2. JOB TEST-BACKEND ───────────────────────────────────────────────────
  test-backend:
    name: 2. Pruebas Unitarias Backend y Cobertura
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas y Cobertura Python (Microservicio Docente)
        run: |
          cd microservicio-docente
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -v --cov=docentes --cov-report=term-missing --cov-fail-under=70

      - name: Pruebas Unitarias SGA Principal (Spring Boot)
        run: |
          cd sga-principal
          ./mvnw clean test -Dtest=EstudianteServiceTest,TeacherAuthorizationServiceTest -q

      - name: Subir reporte de cobertura JaCoCo como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: sga-principal/target/site/jacoco/
          retention-days: 7

  # ─── 3. JOB TEST-WEB ───────────────────────────────────────────────────────
  test-web:
    name: 3. Construcción y Validación Frontend Web
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Compilar Frontend SGA Principal
        run: |
          cd sga-principal/sga-frontend
          npm install --no-audit --legacy-peer-deps
          npm run build

      - name: Compilar Frontend Docente
        run: |
          cd microservicio-docente/frontend
          npm install --no-audit --legacy-peer-deps
          npm run build

      - name: Compilar Frontend Soporte
        run: |
          cd microservicio-soporte
          npm install --no-audit --legacy-peer-deps
          npm run build

      - name: Empaquetar distribución web como artefacto (.tar.gz)
        run: |
          tar -czf release-web.tar.gz sga-principal/sga-frontend/dist microservicio-docente/frontend/dist microservicio-soporte/dist

      - name: Subir artefacto web versionado
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-sha-${{ github.sha }}
          path: release-web.tar.gz
          retention-days: 7

  # ─── 4. JOB TEST-MOBILE ────────────────────────────────────────────────────
  test-mobile:
    name: 4. Pruebas Unitarias App Móvil
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar Pruebas Unitarias JVM de Android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          cd app-movil-docente
          curl --fail --location --output gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

  # ─── 5. JOB BUILD-IMAGES (GHCR) ────────────────────────────────────────────
  build-images:
    name: 5. Construcción y Publicación de Imágenes (GHCR)
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-web
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticación en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y Etiquetar Imagen SGA Principal
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${REPO_LOWER}/sga-principal:${{ github.sha }} -t ghcr.io/${REPO_LOWER}/sga-principal:latest sga-principal/
          docker push ghcr.io/${REPO_LOWER}/sga-principal:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}/sga-principal:latest

      - name: Construir y Etiquetar Imagen Microservicio Docente
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${REPO_LOWER}/microservicio-docente:${{ github.sha }} -t ghcr.io/${REPO_LOWER}/microservicio-docente:latest microservicio-docente/
          docker push ghcr.io/${REPO_LOWER}/microservicio-docente:${{ github.sha }}
          docker push ghcr.io/${REPO_LOWER}/microservicio-docente:latest

  # ─── 6. JOB BUILD-MOBILE-APK ───────────────────────────────────────────────
  build-mobile-apk:
    name: 6. Compilación de Paquete APK Android
    runs-on: ubuntu-latest
    needs: test-mobile
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK en modo Debug
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          cd app-movil-docente
          curl --fail --location --output gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto versionado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-sha-${{ github.sha }}
          path: app-movil-docente/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ─── 7. JOB INTEGRATION & DEPLOY ───────────────────────────────────────────
  integration:
    name: 7. Integración y Despliegue en AWS EC2
    runs-on: ubuntu-latest
    needs:
      - build-images
      - build-mobile-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Despliegue Seguro por SSH a AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/acadtrace || cd ~/sga-sistema-distribuido || git clone https://github.com/LEO23as/acadtrace.git ~/acadtrace
            cd ~/acadtrace || cd ~/sga-sistema-distribuido
            git fetch origin main
            git reset --hard origin/main
            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker image prune -f
