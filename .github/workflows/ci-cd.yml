name: CI/CD Pipeline - AcadTrace (Entrega 4)

on:
  push:
    branches:
      - main
      - feature/entrega-4
      - devBedon
      - Ernesto-Luna
      - Juliana-Emanuel
      - Leonardo-Castro
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  secret-scan:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo del historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ci-docente:
    name: CI Microservicio Docente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Suite, cobertura y comprobaciones Django
        env:
          GRPC_INTERNAL_TOKEN: test-internal-token
        run: |
          cd microservicio-docente
          python -m pip install -r requirements.txt
          python -m pytest -q
          python -m pytest --cov=docentes --cov-report=term-missing --cov-report=html:../docs/cobertura/docente
          python manage.py check --settings=micro_docente.test_settings
          python manage.py makemigrations --check --dry-run --settings=micro_docente.test_settings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-microservicio-docente
          path: docs/cobertura/docente/

  ci-movil-representante:
    name: CI Aplicación Móvil Representante
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tests, JaCoCo y lint
        run: |
          cd app-movil-docente
          chmod +x gradlew
          ./gradlew testDebugUnitTest jacocoTestReport lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-movil-representante
          path: docs/cobertura/movil/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-movil-representante
          path: app-movil-docente/app/build/reports/lint-results-debug.html

  # ─── 1. JOB LINT ───────────────────────────────────────────────────────────
  lint:
    name: 1. Lint y Análisis Estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar finales LF en contenido confirmado (E17)
        run: python scripts/verificar_finales_linea.py

      - name: Instalar dependencias Python para E7
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r microservicio-docente/requirements.txt

      - name: Pruebas del verificador E7 en copias temporales
        run: python -m unittest discover -s experimentos -p test_reproducibilidad.py -v

      - name: Verificar certificado E7 de artefactos versionados
        run: python experimentos/verificar_reproducibilidad.py

      - name: Verificar certificado E7 con reproducibilidad.sh (sha256sum -c)
        run: bash experimentos/reproducibilidad.sh

      - name: Validar sintaxis Python en microservicio-docente
        run: |
          python -m pip install --upgrade pip flake8
          flake8 microservicio-docente/docentes --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verificar finales de línea LF en archivos CSV
        run: |
          python - <<'PY'
          import subprocess

          archivos = [
              ruta
              for ruta in subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", "HEAD"],
                  text=True,
              ).splitlines()
              if ruta.lower().endswith(".csv")
          ]

          invalidos = []

          for ruta in archivos:
              contenido = subprocess.check_output(
                  ["git", "show", f"HEAD:{ruta}"]
              )

              if b"\r" in contenido:
                  invalidos.append(ruta)

          if invalidos:
              print("ERROR: archivos CSV versionados con CR/CRLF:")
              for ruta in invalidos:
                  print(f" - {ruta}")
              raise SystemExit(1)

          print(
              f"OK: {len(archivos)} archivos CSV versionados "
              "usan únicamente LF."
          )
          PY

  # ─── 2. JOB TEST-BACKEND ───────────────────────────────────────────────────
  test-backend:
    name: 2. Pruebas Unitarias Backend y Cobertura
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas y Cobertura Python (Microservicio Docente)
        env:
          GRPC_INTERNAL_TOKEN: test-internal-token
        run: |
          cd microservicio-docente
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -v --cov=docentes --cov-report=term-missing --cov-fail-under=70

      - name: Pruebas Unitarias SGA Principal (Spring Boot)
        env:
          DB_HOST: 192.0.2.1
          DB_PORT: 5433
          DB_NAME: sga
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GRPC_INTERNAL_TOKEN: test-internal-token
          AES_SECRET_KEY: test-aes-key-for-ci-only
        run: |
          cd sga-principal
          ./mvnw clean test -q

      - name: Subir reporte de cobertura JaCoCo como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: sga-principal/target/site/jacoco/
          retention-days: 7

  test-soporte-backend:
    name: CI Backend Microservicio Soporte
    runs-on: ubuntu-latest
    needs: lint
    env:
      GRPC_INTERNAL_TOKEN: test-internal-token
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Ejecutar pruebas y cobertura JaCoCo de Soporte
        working-directory: microservicio-soporte/backend
        env:
          GRPC_INTERNAL_TOKEN: test-internal-token
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Subir reporte JaCoCo de Soporte
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-microservicio-soporte
          path: microservicio-soporte/backend/target/site/jacoco/
          retention-days: 7

  test-secretaria-backend:
    name: CI Backend Microservicio Secretaría
    runs-on: ubuntu-latest
    needs: lint
    env:
      DB_PASSWORD: test_secret_pass
      JWT_SECRET: test-container-jwt-secret-key-32-chars-long-minimum
      AES_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GRPC_INTERNAL_TOKEN: test-internal-token
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Ejecutar pruebas y cobertura JaCoCo de Secretaría
        working-directory: microservicio-secretaria/backend
        run: |
          chmod +x mvnw
          ./mvnw clean test -Dsurefire.useFile=false || { echo "=== DUMPING FAILED LOGS ==="; for f in target/surefire-reports/*; do echo "=== $f ==="; cat "$f"; done; exit 1; }

      - name: Subir reporte JaCoCo de Secretaría
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-microservicio-secretaria
          path: microservicio-secretaria/backend/target/site/jacoco/
          retention-days: 7

      - name: Subir reportes de prueba Surefire
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-secretaria
          path: microservicio-secretaria/backend/target/surefire-reports/
          retention-days: 7

  # ─── 3. JOB TEST-WEB ───────────────────────────────────────────────────────
  contract-openapi-secretaria:
    name: Contrato OpenAPI runtime de Secretaría
    needs: test-secretaria-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyYAML
        run: python -m pip install PyYAML
      - name: Empaquetar Secretaría sin repetir tests
        working-directory: microservicio-secretaria/backend
        run: |
          bash mvnw -B -Dmaven.test.skip=true -Djacoco.skip=true package
          test -s target/sga-secretaria-backend.jar
      - name: Comparar OpenAPI con Secretaría y PostgreSQL efímeros
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import secrets
          import signal
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request

          root = Path.cwd()
          jar = root / "microservicio-secretaria/backend/target/sga-secretaria-backend.jar"
          url = "http://localhost:5176/v3/api-docs"
          container = "openapi-secretaria-" + secrets.token_hex(6)
          backend = None
          result = 2
          failed = False
          stage = "PostgreSQL"
          ephemeral = {
              "DB_PASSWORD": secrets.token_urlsafe(32),
              "JWT_SECRET": secrets.token_hex(32),
              "AES_SECRET_KEY": base64.b64encode(secrets.token_bytes(32)).decode(),
              "GRPC_INTERNAL_TOKEN": secrets.token_urlsafe(32),
          }
          for value in ephemeral.values():
              print("::add-mask::" + value, flush=True)
          env = os.environ.copy()
          env.update(ephemeral)
          env.update({
              "DB_HOST": "localhost", "DB_NAME": "sga",
              "DB_USER": "postgres", "DB_SSL": "false", "PORT": "5176",
              "POSTGRES_DB": "sga", "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": ephemeral["DB_PASSWORD"],
          })

          def docker(*args, check=True):
              return subprocess.run(
                  ["docker", *args], env=env, capture_output=True,
                  text=True, check=check, timeout=120,
              )

          def interrupted(signum, frame):
              raise SystemExit(2)

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)

          with tempfile.TemporaryDirectory(prefix="openapi-secretaria-") as temporary:
              logfile = Path(temporary) / "backend.log"
              try:
                  # Sin mounts, SQL ni migraciones: base nueva y vacía.
                  docker(
                      "run", "--detach", "--name", container,
                      "--publish", "127.0.0.1::5432",
                      "--env", "POSTGRES_DB", "--env", "POSTGRES_USER",
                      "--env", "POSTGRES_PASSWORD",
                      "--health-cmd", "pg_isready -U postgres -d sga",
                      "--health-interval", "2s", "--health-timeout", "3s",
                      "--health-retries", "30", "postgres:15-alpine",
                  )
                  deadline = time.monotonic() + 60
                  while True:
                      state = json.loads(docker(
                          "inspect", "--format", "{{json .State}}", container
                      ).stdout)
                      if not state["Running"] or state["Health"]["Status"] == "unhealthy":
                          raise RuntimeError("PostgreSQL no saludable")
                      if state["Health"]["Status"] == "healthy":
                          break
                      if time.monotonic() >= deadline:
                          raise TimeoutError("PostgreSQL")
                      time.sleep(1)
                  mapping = docker("port", container, "5432/tcp").stdout.strip()
                  env["DB_PORT"] = mapping.rsplit(":", 1)[1]

                  stage = "startup/OpenAPI"
                  # CWD temporal para no cargar un .env del repositorio.
                  with logfile.open("wb") as output:
                      backend = subprocess.Popen(
                          ["java", "-jar", str(jar)], cwd=temporary, env=env,
                          stdout=output, stderr=subprocess.STDOUT,
                      )
                  print(f"PID Secretaría: {backend.pid}", flush=True)
                  deadline = time.monotonic() + 60
                  while True:
                      if backend.poll() is not None:
                          raise RuntimeError("Java terminó antes de estar listo")
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise TimeoutError("OpenAPI")
                      try:
                          with urllib.request.urlopen(url, timeout=min(2, remaining)) as response:
                              if response.status != 200 or response.geturl() != url:
                                  raise ValueError("HTTP inesperado")
                              document = json.load(response)
                              if not isinstance(document, dict) or not isinstance(document.get("paths"), dict):
                                  raise ValueError("JSON sin paths")
                          break
                      except (urllib.error.URLError, TimeoutError, ValueError, OSError):
                          time.sleep(min(1, max(0, deadline - time.monotonic())))
                  if backend.poll() is not None:
                      raise RuntimeError("Java terminó antes de la verificación")
                  stage = "verificador"
                  # El script existente valida OpenAPI y compara método + path.
                  result = subprocess.run(
                      [sys.executable, "scripts/verificar_openapi.py"],
                      cwd=root, env=env, check=False, timeout=30,
                  ).returncode
                  failed = result == 2
              except Exception as exc:
                  print(f"ERROR en {stage}: {type(exc).__name__}", file=sys.stderr)
                  result = 2
                  failed = True
              finally:
                  # La limpieza no sustituye el exit code del verificador.
                  try:
                      if backend is not None and backend.poll() is None:
                          backend.terminate()
                          try:
                              backend.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              backend.kill()
                              backend.wait(timeout=5)
                  finally:
                      try:
                          if failed:
                              text = logfile.read_text(encoding="utf-8", errors="replace") if logfile.exists() else ""
                              pg = docker("logs", "--tail", "40", container, check=False)
                              text += "\nPostgreSQL:\n" + pg.stdout + pg.stderr
                              for value in ephemeral.values():
                                  text = text.replace(value, "[REDACTADO]")
                              for line in text.splitlines()[-160:]:
                                  print("diagnóstico | " + line)
                      except Exception:
                          print("No se pudieron recuperar todos los logs de diagnóstico.")
                      finally:
                          try:
                              cleanup = docker("rm", "--force", "--volumes", container, check=False)
                              if cleanup.returncode != 0:
                                  print("::warning::Comprobar limpieza del contenedor efímero.")
                          except Exception:
                              print("::warning::No se pudo completar la limpieza Docker.")
          sys.exit(result)
          PY

  test-web:
    name: 3. Construcción y Validación Frontend Web
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Compilar Frontend SGA Principal
        run: |
          cd sga-principal/sga-frontend
          npm ci --no-audit
          npm run build

      - name: Compilar Frontend Docente
        run: |
          cd microservicio-docente/frontend
          npm ci --no-audit
          npm run build

      - name: Compilar Frontend Soporte
        run: |
          cd microservicio-soporte
          npm ci --no-audit
          npm run build

      - name: Compilar Frontend Secretaría (E12 con npm ci)
        run: |
          cd microservicio-secretaria/client
          npm ci --no-audit
          npm run build

      - name: Empaquetar distribución web como artefacto (.tar.gz)
        run: |
          tar -czf release-web.tar.gz sga-principal/sga-frontend/dist microservicio-docente/frontend/dist microservicio-soporte/dist microservicio-secretaria/client/dist

      - name: Subir artefacto web versionado
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-sha-${{ github.sha }}
          path: release-web.tar.gz
          retention-days: 7

  e2e-docente:
    name: E10 - Playwright Frontend Docente
    runs-on: ubuntu-latest

    concurrency:
     group: e10-docente-entorno-real
     cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: microservicio-docente/frontend/package-lock.json
      - name: Validar configuración E2E
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_LOGIN_URL: ${{ vars.E2E_LOGIN_URL }}
          E2E_DOCENTE_USER: ${{ secrets.E2E_DOCENTE_USER }}
          E2E_DOCENTE_PASSWORD: ${{ secrets.E2E_DOCENTE_PASSWORD }}
          E2E_ACTIVIDAD: ${{ vars.E2E_ACTIVIDAD }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_LOGIN_URL"
          test -n "$E2E_DOCENTE_USER"
          test -n "$E2E_DOCENTE_PASSWORD"
          test -n "$E2E_ACTIVIDAD"
      - name: Instalar frontend y Chromium
        working-directory: microservicio-docente/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ejecutar recorridos E2E
        working-directory: microservicio-docente/frontend
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_LOGIN_URL: ${{ vars.E2E_LOGIN_URL }}
          E2E_DOCENTE_USER: ${{ secrets.E2E_DOCENTE_USER }}
          E2E_DOCENTE_PASSWORD: ${{ secrets.E2E_DOCENTE_PASSWORD }}
          E2E_GRADO: ${{ vars.E2E_GRADO }}
          E2E_CURSO: ${{ vars.E2E_CURSO }}
          E2E_ACTIVIDAD: ${{ vars.E2E_ACTIVIDAD }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-docente
          path: microservicio-docente/frontend/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-docente
          path: microservicio-docente/frontend/test-results/
          retention-days: 7

  # ─── 4. JOB TEST-MOBILE ────────────────────────────────────────────────────
  test-mobile:
    name: 4. Pruebas Unitarias App Móvil
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar Pruebas Unitarias JVM de Android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          cd app-movil-docente
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

  # ─── 4b. JOB CONTRACT-OPENAPI (E4) ─────────────────────────────────────────
  contract-openapi:
    name: E4 - Verificación de contrato OpenAPI
    runs-on: ubuntu-latest
    needs: [test-backend, test-secretaria-backend, test-soporte-backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {java-version: "17", distribution: "temurin"}
      - name: Levantar servicios en background
        run: |
          cd sga-principal && ./mvnw spring-boot:run &
          cd microservicio-secretaria/backend && ./mvnw spring-boot:run &
          cd microservicio-soporte/backend && PORT=8083 ./mvnw spring-boot:run &
          sleep 60
      - name: Instalar deps
        run: pip install pyyaml
      - name: Comparar contrato con servicios
        run: python scripts/verificar_openapi.py

  # ─── 5. JOB BUILD-IMAGES (GHCR) ────────────────────────────────────────────
  build-images:
    name: 5. Imagen GHCR (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-soporte-backend
      - test-secretaria-backend
      - test-web
      - lint
      - ci-docente
      - ci-movil-representante
      - test-mobile
      - e2e-docente
      - contract-openapi
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sga-principal
            context: sga-principal
            dockerfile: sga-principal/Dockerfile
          - image: microservicio-docente
            context: microservicio-docente
            dockerfile: microservicio-docente/Dockerfile
          - image: microservicio-secretaria
            context: microservicio-secretaria
            dockerfile: microservicio-secretaria/backend/Dockerfile
          - image: microservicio-soporte
            context: microservicio-soporte
            dockerfile: microservicio-soporte/backend/Dockerfile
          - image: microservicio-ia
            context: microservicio-ia
            dockerfile: microservicio-ia/Dockerfile
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticación en GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags de imagen
        id: image-tags
        env:
          IMAGE_MODULE: ${{ matrix.image }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          OWNER_LOWER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${OWNER_LOWER}/${IMAGE_MODULE}"
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${GITHUB_SHA}"
            if [ "$PUBLISH" = 'true' ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Construir imagen y publicar solo en main
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image-tags.outputs.tags }}


  # ─── 6. JOB BUILD-MOBILE-APK ───────────────────────────────────────────────
  build-mobile-apk:
    name: 6. Compilación de Paquete APK Android
    runs-on: ubuntu-latest
    needs: test-mobile
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar secretos de Release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SGA_RELEASE_STORE_PASSWORD: ${{ secrets.SGA_RELEASE_STORE_PASSWORD }}
          SGA_RELEASE_KEY_ALIAS: ${{ secrets.SGA_RELEASE_KEY_ALIAS }}
          SGA_RELEASE_KEY_PASSWORD: ${{ secrets.SGA_RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$SGA_RELEASE_STORE_PASSWORD"
          test -n "$SGA_RELEASE_KEY_ALIAS"
          test -n "$SGA_RELEASE_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"

      - name: Restaurar keystore de Release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/acadtrace-release.jks"
          test -s "$RUNNER_TEMP/acadtrace-release.jks"

      - name: Validar keystore PKCS12 reconstruido
        env:
          SGA_RELEASE_STORE_PASSWORD: ${{ secrets.SGA_RELEASE_STORE_PASSWORD }}
          SGA_RELEASE_KEY_ALIAS: ${{ secrets.SGA_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/acadtrace-release.jks"
          EXPECTED_SIZE=2782
          EXPECTED_SHA256="C076C5BDB2B017E8F2FC8F3AE5D1228B7B01331B032397EBBC2058DAC4DF9E9A"

          test -s "$KEYSTORE"
          ACTUAL_SIZE="$(stat -c '%s' "$KEYSTORE")"
          printf 'Tamaño del keystore: %s bytes\n' "$ACTUAL_SIZE"
          test "$ACTUAL_SIZE" -eq "$EXPECTED_SIZE"

          ACTUAL_SHA256="$(sha256sum "$KEYSTORE" | awk '{print toupper($1)}')"
          printf 'SHA-256 del keystore: %s\n' "$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$SGA_RELEASE_STORE_PASSWORD" \
            -alias "$SGA_RELEASE_KEY_ALIAS" \
            > /dev/null

      - name: Restaurar configuración Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app-movil-docente/app/google-services.json
          test -s app-movil-docente/app/google-services.json

      - name: Compilar APK y AAB Release firmados
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          SGA_RELEASE_STORE_FILE: ${{ runner.temp }}/acadtrace-release.jks
          SGA_RELEASE_STORE_PASSWORD: ${{ secrets.SGA_RELEASE_STORE_PASSWORD }}
          SGA_RELEASE_KEY_ALIAS: ${{ secrets.SGA_RELEASE_KEY_ALIAS }}
          SGA_RELEASE_KEY_PASSWORD: ${{ secrets.SGA_RELEASE_KEY_PASSWORD }}
        run: |
          cd app-movil-docente
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Verificar firma y calcular SHA-256
        run: |
          set -euo pipefail
          APK="app-movil-docente/app/build/outputs/apk/release/app-release.apk"
          AAB="app-movil-docente/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"

          sha256sum "$APK" "$AAB" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Subir paquete móvil Release firmado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-sha-${{ github.sha }}
          path: |
            app-movil-docente/app/build/outputs/apk/release/app-release.apk
            app-movil-docente/app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # ─── 7. JOB INTEGRATION & DEPLOY ───────────────────────────────────────────
  integration:
    name: 7. Integración y Despliegue en AWS EC2
    runs-on: ubuntu-latest
    needs:
      - build-images
      - build-mobile-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Despliegue Seguro por SSH a AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GRPC_INTERNAL_TOKEN: ${{ secrets.GRPC_INTERNAL_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GRPC_INTERNAL_TOKEN
          script: |
            cd ~/acadtrace || cd ~/sga-sistema-distribuido || git clone https://github.com/LEO23as/acadtrace.git ~/acadtrace
            cd ~/acadtrace || cd ~/sga-sistema-distribuido
            git fetch origin main
            git reset --hard origin/main
            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker image prune -f
            
            echo "==> Iniciando sondas de salud posterior al arranque (Criterio E15)..."
            sleep 15
            
            check_health() {
              local url=$1
              local name=$2
              echo "Verificando $name en $url..."
              # Aumentamos a 30 intentos (150 segundos) porque AWS EC2 puede ser lento para iniciar Java
              for i in {1..60}; do
                HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $url)
                if [ "$HTTP_STATUS" = "200" ]; then
                  echo "$name esta SANO (HTTP 200)."
                  return 0
                fi
                sleep 5
              done
              echo "ERROR: $name NUNCA REPORTO SALUD (Fallo el despliegue)"
              docker compose logs "$name"
              return 1
            }
            
            check_health "http://localhost:8080/actuator/health" "sga-principal" || exit 1
            check_health "http://localhost:5176/actuator/health" "microservicio-secretaria" || exit 1
            check_health "http://localhost:8083/actuator/health" "microservicio-soporte" || exit 1
            check_health "http://localhost:8081/health/" "microservicio-docente" || exit 1
            
            echo "==> Todos los contenedores reportaron salud exitosamente."
