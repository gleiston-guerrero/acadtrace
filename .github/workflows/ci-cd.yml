name: CI/CD Pipeline - AcadTrace (Entrega 4)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── 1. JOB TEST (Exigido en Paso 2) ──────────────────────────────────────
  test:
    name: 1. Pruebas Unitarias y Cobertura JaCoCo (JUnit 5 + Mockito)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias de sga-principal
        run: |
          cd sga-principal
          ./mvnw clean test -Dtest=EstudianteServiceTest -q

      - name: Subir reporte de cobertura JaCoCo como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: sga-principal/target/site/jacoco/
          retention-days: 7

  # ─── 2. JOB LINT (Exigido en Paso 2) ──────────────────────────────────────
  lint:
    name: 2. Análisis Estático de Código y Compilación
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilación y validación de sintaxis
        run: |
          cd sga-principal
          ./mvnw compile -DskipTests -q

  # ─── 3. JOB BUILD (Exigido en Paso 2) ─────────────────────────────────────
  build:
    name: 3. Construcción y Empaquetado de Artefacto (JAR)
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generar paquete ejecutable JAR
        run: |
          cd sga-principal
          ./mvnw package -DskipTests -q

  # ─── 4. JOB INTEGRATION-TEST & DEPLOY (Exigido en Paso 2) ─────────────────
  deploy:
    name: 4. Despliegue Automático en AWS EC2
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Conectar por SSH a AWS EC2 y Actualizar
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/acadtrace || cd ~/sga-sistema-distribuido || git clone https://github.com/LEO23as/acadtrace.git ~/acadtrace
            cd ~/acadtrace || cd ~/sga-sistema-distribuido
            git pull origin main
            docker compose up -d --build
            docker image prune -f