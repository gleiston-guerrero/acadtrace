name: CI/CD Pipeline - SGA Distribuido AWS EC2

on:
  push:
    branches:
      - main
      - devBedon
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test-docente:
    name: CI Microservicio Docente
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: microservicio-docente

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas y cobertura
        run: |
          python -m pytest -v --cov=. --cov-report=term-missing --cov-fail-under=70


  deploy:
    name: Despliegue Automático en AWS EC2
    runs-on: ubuntu-latest

    # El despliegue solo se ejecuta desde main.
    # En devBedon aparecerá como skipped.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Conectar por SSH a AWS EC2 y Actualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/sga-sistema-distribuido || git clone https://github.com/LEO23as/sga-sistema-distribuido.git ~/sga-sistema-distribuido
            cd ~/sga-sistema-distribuido
            git pull origin main
            docker compose up -d --build
            docker image prune -f