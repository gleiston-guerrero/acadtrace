name: CI/CD Pipeline - AcadTrace (Entrega 4)

on:
  push:
    branches:
      - main
      - feature/entrega-4
      - devBedon
      - Ernesto-Luna
      - Juliana-Emanuel
      - Leonardo-Castro
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  secret-scan:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo del historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escanear arbol completo con gitleaks
        if: always()
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 0 --report-format json --report-path gitleaks-tree-report.json
          echo "Escaneo del arbol completo terminado. Ver artefacto gitleaks-tree-report.json."

      - name: Subir reporte de gitleaks del arbol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-tree-report
          path: gitleaks-tree-report.json
          retention-days: 30

  verificar-matriz-iso25010:
    name: Verificar matriz ISO 25010 del informe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerar matriz ISO 25010
        run: python generar_matriz.py --write-csv --write-latex

      - name: Verificar matriz generada y sincronizada
        run: |
          test -s docs/experimentos/resultados/matriz_iso25010.csv
          test -s Informe-E4_BCEL/matriz_iso25010_generada.tex
          git diff --exit-code -- docs/experimentos/resultados/matriz_iso25010.csv Informe-E4_BCEL/matriz_iso25010_generada.tex

  ci-docente:
    name: CI Microservicio Docente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Suite, cobertura y comprobaciones Django
        env:
          GRPC_INTERNAL_TOKEN: test-internal-token
        run: |
          cd microservicio-docente
          python -m pip install -r requirements.txt
          python -m pytest -q
          python -m pytest --cov=docentes --cov-fail-under=70 --cov-report=term-missing --cov-report=html:../docs/cobertura/docente
          python manage.py check --settings=micro_docente.test_settings
          python manage.py makemigrations --check --dry-run --settings=micro_docente.test_settings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-microservicio-docente
          path: docs/cobertura/docente/

  ci-movil-representante:
    name: CI Aplicación Móvil Representante
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tests, JaCoCo y lint
        run: |
          cd app-movil-docente
          chmod +x gradlew
          ./gradlew testDebugUnitTest jacocoTestReport lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-movil-representante
          path: docs/cobertura/movil/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-movil-representante
          path: app-movil-docente/app/build/reports/lint-results-debug.html

  # ─── 1. JOB LINT ───────────────────────────────────────────────────────────
  lint:
    name: 1. Lint y Análisis Estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar finales LF en contenido confirmado (E17)
        run: python scripts/verificar_finales_linea.py

      - name: Instalar dependencias Python para E7
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r microservicio-docente/requirements.txt

      - name: Pruebas del verificador E7 en copias temporales
        run: python -m unittest discover -s experimentos -p test_reproducibilidad.py -v

      - name: Verificar certificado E7 de artefactos versionados
        run: python experimentos/verificar_reproducibilidad.py

      - name: Verificar certificado E7 con reproducibilidad.sh (sha256sum -c)
        run: bash experimentos/reproducibilidad.sh

      - name: Validar sintaxis Python en microservicio-docente
        run: |
          python -m pip install --upgrade pip flake8
          flake8 microservicio-docente/docentes --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verificar finales de línea LF en archivos CSV
        run: |
          python - <<'PY'
          import subprocess

          archivos = [
              ruta
              for ruta in subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", "HEAD"],
                  text=True,
              ).splitlines()
              if ruta.lower().endswith(".csv")
          ]

          invalidos = []

          for ruta in archivos:
              contenido = subprocess.check_output(
                  ["git", "show", f"HEAD:{ruta}"]
              )

              if b"\r" in contenido:
                  invalidos.append(ruta)

          if invalidos:
              print("ERROR: archivos CSV versionados con CR/CRLF:")
              for ruta in invalidos:
                  print(f" - {ruta}")
              raise SystemExit(1)

          print(
              f"OK: {len(archivos)} archivos CSV versionados "
              "usan únicamente LF."
          )
          PY

  # ─── 2. JOB TEST-BACKEND ───────────────────────────────────────────────────
  test-backend:
    name: 2. Pruebas Unitarias Backend y Cobertura
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pruebas y Cobertura Python (Microservicio Docente)
        env:
          GRPC_INTERNAL_TOKEN: test-internal-token
        run: |
          cd microservicio-docente
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -v --cov=docentes --cov-report=term-missing --cov-fail-under=70

      - name: Pruebas Unitarias SGA Principal (Spring Boot)
        env:
          DB_HOST: 192.0.2.1
          DB_PORT: 5433
          DB_NAME: sga
          DB_USER: sga_app
          DB_PASSWORD: ${{ secrets.SGA_APP_PASSWORD || secrets.DB_PASSWORD }}
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SGA_APP_PASSWORD: ${{ secrets.SGA_APP_PASSWORD || secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GRPC_INTERNAL_TOKEN: test-internal-token
          AES_SECRET_KEY: test-aes-key-for-ci-only
        run: |
          cd sga-principal
          ./mvnw clean test -q

      - name: Subir reportes de prueba Surefire (sga-principal)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-sga-principal
          path: sga-principal/target/surefire-reports/
          retention-days: 7

      - name: Subir reporte JaCoCo (sga-principal)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-sga-principal
          path: sga-principal/target/site/jacoco/
          retention-days: 7

  test-soporte-backend:
    name: CI Backend Microservicio Soporte
    runs-on: ubuntu-latest
    needs: lint
    env:
      GRPC_INTERNAL_TOKEN: test-internal-token
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Ejecutar pruebas y cobertura JaCoCo de Soporte
        working-directory: microservicio-soporte/backend
        env:
          GRPC_INTERNAL_TOKEN: test-internal-token
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Subir reporte JaCoCo de Soporte
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-microservicio-soporte
          path: microservicio-soporte/backend/target/site/jacoco/
          retention-days: 7

  test-secretaria-backend:
    name: CI Backend Microservicio Secretaría
    runs-on: ubuntu-latest
    needs: lint
    env:
      DB_PASSWORD: test_secret_pass
      JWT_SECRET: test-container-jwt-secret-key-32-chars-long-minimum
      AES_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GRPC_INTERNAL_TOKEN: test-internal-token
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Ejecutar pruebas y cobertura JaCoCo de Secretaría
        working-directory: microservicio-secretaria/backend
        run: |
          chmod +x mvnw
          ./mvnw clean test -Dsurefire.useFile=false || { echo "=== DUMPING FAILED LOGS ==="; for f in target/surefire-reports/*; do echo "=== $f ==="; cat "$f"; done; exit 1; }

      - name: Subir reporte JaCoCo de Secretaría
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-microservicio-secretaria
          path: microservicio-secretaria/backend/target/site/jacoco/
          retention-days: 7

      - name: Subir reportes de prueba Surefire
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-secretaria
          path: microservicio-secretaria/backend/target/surefire-reports/
          retention-days: 7

  # ─── 2b. JOB CONTRACT-OPENAPI (E4) ─────────────────────────────────────────
  contract-openapi:
    name: E4 - Verificación de contrato OpenAPI
    needs: test-secretaria-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyYAML
        run: python -m pip install PyYAML
      - name: Empaquetar Secretaría sin repetir tests
        working-directory: microservicio-secretaria/backend
        run: |
          bash mvnw -B -Dmaven.test.skip=true -Djacoco.skip=true package
          test -s target/sga-secretaria-backend.jar
      - name: Comparar OpenAPI con Secretaría y PostgreSQL efímeros
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import secrets
          import signal
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request

          root = Path.cwd()
          jar = root / "microservicio-secretaria/backend/target/sga-secretaria-backend.jar"
          url = "http://localhost:5176/v3/api-docs"
          container = "openapi-secretaria-" + secrets.token_hex(6)
          backend = None
          result = 2
          failed = False
          stage = "PostgreSQL"
          ephemeral = {
              "DB_PASSWORD": secrets.token_urlsafe(32),
              "JWT_SECRET": secrets.token_hex(32),
              "AES_SECRET_KEY": base64.b64encode(secrets.token_bytes(32)).decode(),
              "GRPC_INTERNAL_TOKEN": secrets.token_urlsafe(32),
          }
          for value in ephemeral.values():
              print("::add-mask::" + value, flush=True)
          env = os.environ.copy()
          env.update(ephemeral)
          env.update({
              "DB_HOST": "localhost", "DB_NAME": "sga",
              "DB_USER": "sga_app", "DB_SSL": "false", "PORT": "5176",
              "POSTGRES_DB": "sga", "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": ephemeral["DB_PASSWORD"],
          })

          def docker(*args, check=True):
              return subprocess.run(
                  ["docker", *args], env=env, capture_output=True,
                  text=True, check=check, timeout=120,
              )

          def interrupted(signum, frame):
              raise SystemExit(2)

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)

          with tempfile.TemporaryDirectory(prefix="openapi-secretaria-") as temporary:
              logfile = Path(temporary) / "backend.log"
              try:
                  # Sin mounts, SQL ni migraciones: base nueva y vacía.
                  docker(
                      "run", "--detach", "--name", container,
                      "--publish", "127.0.0.1::5432",
                      "--env", "POSTGRES_DB", "--env", "POSTGRES_USER",
                      "--env", "POSTGRES_PASSWORD",
                      "--health-cmd", "pg_isready -U postgres -d sga",
                      "--health-interval", "2s", "--health-timeout", "3s",
                      "--health-retries", "30", "postgres:15-alpine",
                  )
                  deadline = time.monotonic() + 60
                  while True:
                      state = json.loads(docker(
                          "inspect", "--format", "{{json .State}}", container
                      ).stdout)
                      if not state["Running"] or state["Health"]["Status"] == "unhealthy":
                          raise RuntimeError("PostgreSQL no saludable")
                      if state["Health"]["Status"] == "healthy":
                          break
                      if time.monotonic() >= deadline:
                          raise TimeoutError("PostgreSQL")
                      time.sleep(1)
                  mapping = docker("port", container, "5432/tcp").stdout.strip()
                  env["DB_PORT"] = mapping.rsplit(":", 1)[1]

                  stage = "startup/OpenAPI"
                  # CWD temporal para no cargar un .env del repositorio.
                  with logfile.open("wb") as output:
                      backend = subprocess.Popen(
                          ["java", "-jar", str(jar)], cwd=temporary, env=env,
                          stdout=output, stderr=subprocess.STDOUT,
                      )
                  print(f"PID Secretaría: {backend.pid}", flush=True)
                  deadline = time.monotonic() + 60
                  while True:
                      if backend.poll() is not None:
                          raise RuntimeError("Java terminó antes de estar listo")
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise TimeoutError("OpenAPI")
                      try:
                          with urllib.request.urlopen(url, timeout=min(2, remaining)) as response:
                              if response.status != 200 or response.geturl() != url:
                                  raise ValueError("HTTP inesperado")
                              document = json.load(response)
                              if not isinstance(document, dict) or not isinstance(document.get("paths"), dict):
                                  raise ValueError("JSON sin paths")
                          break
                      except (urllib.error.URLError, TimeoutError, ValueError, OSError):
                          time.sleep(min(1, max(0, deadline - time.monotonic())))
                  if backend.poll() is not None:
                      raise RuntimeError("Java terminó antes de la verificación")
                  stage = "verificador"
                  # El script existente valida OpenAPI y compara método + path.
                  result = subprocess.run(
                      [sys.executable, "scripts/verificar_openapi.py"],
                      cwd=root, env=env, check=False, timeout=30,
                  ).returncode
                  failed = result == 2
              except Exception as exc:
                  print(f"ERROR en {stage}: {type(exc).__name__}", file=sys.stderr)
                  result = 2
                  failed = True
              finally:
                  # La limpieza no sustituye el exit code del verificador.
                  try:
                      if backend is not None and backend.poll() is None:
                          backend.terminate()
                          try:
                              backend.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              backend.kill()
                              backend.wait(timeout=5)
                  finally:
                      try:
                          if failed:
                              text = logfile.read_text(encoding="utf-8", errors="replace") if logfile.exists() else ""
                              pg = docker("logs", "--tail", "40", container, check=False)
                              text += "\nPostgreSQL:\n" + pg.stdout + pg.stderr
                              for value in ephemeral.values():
                                  text = text.replace(value, "[REDACTADO]")
                              for line in text.splitlines()[-160:]:
                                  print("diagnóstico | " + line)
                      except Exception:
                          print("No se pudieron recuperar todos los logs de diagnóstico.")
                      finally:
                          try:
                              cleanup = docker("rm", "--force", "--volumes", container, check=False)
                              if cleanup.returncode != 0:
                                  print("::warning::Comprobar limpieza del contenedor efímero.")
                          except Exception:
                              print("::warning::No se pudo completar la limpieza Docker.")
          sys.exit(result)
          PY

  test-web:
    name: 3. Construcción y Validación Frontend Web
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Compilar Frontend SGA Principal
        run: |
          cd sga-principal/sga-frontend
          npm ci --no-audit
          npm run build

      - name: Compilar Frontend Docente
        run: |
          cd microservicio-docente/frontend
          npm ci --no-audit
          npm run build

      - name: Compilar Frontend Soporte
        run: |
          cd microservicio-soporte
          npm ci --no-audit
          npm run build

      - name: Compilar Frontend Secretaría (E12 con npm ci)
        run: |
          cd microservicio-secretaria/client
          npm ci --no-audit
          npm run build

      - name: Empaquetar distribución web como artefacto (.tar.gz)
        run: |
          tar -czf release-web.tar.gz sga-principal/sga-frontend/dist microservicio-docente/frontend/dist microservicio-soporte/dist microservicio-secretaria/client/dist

      - name: Subir artefacto web versionado
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-sha-${{ github.sha }}
          path: release-web.tar.gz
          retention-days: 7

  e2e-docente:
    name: E10 - Playwright Frontend Docente
    runs-on: ubuntu-latest

    concurrency:
      group: e10-docente-entorno-real
      cancel-in-progress: false

    env:
      DB_HOST: postgres-e10
      DB_PORT: "5432"
      DB_NAME: sga
      DB_USER: sga_app
      FLYWAY_USER: sga_app
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      FCM_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_LOGIN_URL: http://127.0.0.1:5173/login

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: microservicio-docente/frontend/package-lock.json

      - name: Instalar frontend y Chromium
        working-directory: microservicio-docente/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validar configuracion E2E
        shell: bash
        run: |
          test -n "$JWT_SECRET"

      - name: Generar credenciales efimeras de E10
        shell: bash
        run: |
          set -euo pipefail

          DB_PASSWORD="$(openssl rand -hex 32)"
          SGA_APP_PASSWORD="$(openssl rand -hex 32)"
          AES_SECRET_KEY="$(openssl rand -base64 32)"
          GRPC_INTERNAL_TOKEN="$(openssl rand -hex 32)"
          E2E_DOCENTE_PASSWORD="E10-$(openssl rand -hex 16)"
          E2E_DOCENTE_HASH="$(docker run --rm httpd:2.4-alpine htpasswd -nbBC 10 e10 "$E2E_DOCENTE_PASSWORD" | cut -d: -f2)"

          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$SGA_APP_PASSWORD"
          echo "::add-mask::$AES_SECRET_KEY"
          echo "::add-mask::$GRPC_INTERNAL_TOKEN"
          echo "::add-mask::$E2E_DOCENTE_PASSWORD"
          echo "::add-mask::$E2E_DOCENTE_HASH"

          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "SGA_APP_PASSWORD=$SGA_APP_PASSWORD" >> "$GITHUB_ENV"
          echo "FLYWAY_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "AES_SECRET_KEY=$AES_SECRET_KEY" >> "$GITHUB_ENV"
          echo "GRPC_INTERNAL_TOKEN=$GRPC_INTERNAL_TOKEN" >> "$GITHUB_ENV"
          echo "E2E_DOCENTE_USER=docente.e10@acadtrace.test" >> "$GITHUB_ENV"
          echo "E2E_DOCENTE_PASSWORD=$E2E_DOCENTE_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_DOCENTE_HASH=$E2E_DOCENTE_HASH" >> "$GITHUB_ENV"
          echo "E2E_GRADO=Grado E10" >> "$GITHUB_ENV"
          echo "E2E_CURSO=Matematica E10" >> "$GITHUB_ENV"
          echo "E2E_ACTIVIDAD=Actividad E10" >> "$GITHUB_ENV"

      - name: Construir servicios de E10
        shell: bash
        run: |
          set -euo pipefail

          docker network create e10-docente

          docker run -d \
            --name postgres-e10 \
            --network e10-docente \
            -e POSTGRES_DB="$DB_NAME" \
            -e POSTGRES_USER="postgres" \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            --health-cmd="pg_isready -U postgres -d $DB_NAME" \
            --health-interval=2s \
            --health-timeout=3s \
            --health-retries=30 \
            postgres:16-alpine

          docker cp \
            sga-principal/src/main/resources/db/migration/V8__baseline_completo.sql \
            postgres-e10:/baseline_flyway_v8.sql

          # Flyway esta deshabilitado para sga-principal en E10 (entregable #36),
          # asi que V18 (creacion del rol sga_app de menor privilegio) tampoco
          # corre automaticamente. Se aplica aqui manualmente, igual que el
          # baseline V8, sustituyendo el placeholder ${sga_app_password} que
          # Flyway normalmente resuelve por su cuenta.
          sed "s/\${sga_app_password}/${SGA_APP_PASSWORD}/" \
            sga-principal/src/main/resources/db/migration/V18__rol_aplicacion_y_revocacion_auditoria.sql \
            > /tmp/v18_rol_sga_app.sql

          docker cp \
            /tmp/v18_rol_sga_app.sql \
            postgres-e10:/v18_rol_sga_app.sql

          for intento in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' postgres-e10)" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          test "$(docker inspect --format='{{.State.Health.Status}}' postgres-e10)" = "healthy"

          docker exec \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres-e10 \
            psql -v ON_ERROR_STOP=1 \
            -U postgres \
            -d "$DB_NAME" \
            -f /baseline_flyway_v8.sql

          docker exec \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres-e10 \
            psql -v ON_ERROR_STOP=1 \
            -U postgres \
            -d "$DB_NAME" \
            -f /v18_rol_sga_app.sql

          docker build -t e10-sga-principal ./sga-principal
          docker build -t e10-microservicio-docente ./microservicio-docente

      - name: Levantar backend Principal
        shell: bash
        run: |
          docker run -d \
            --name sga-principal \
            --network e10-docente \
            -p 8080:8080 \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_NAME \
            -e DB_USER=sga_app \
            -e DB_PASSWORD="$SGA_APP_PASSWORD" \
            -e SGA_APP_PASSWORD \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -e SPRING_FLYWAY_ENABLED=false \
            -e JWT_SECRET \
            -e AES_SECRET_KEY \
            -e GRPC_INTERNAL_TOKEN \
            -e MAIL_PASSWORD \
            -e FCM_ENABLED \
            -e GOOGLE_APPLICATION_CREDENTIALS= \
            -e grpc.client.docente-service.address=dns:///microservicio-docente:9091 \
            e10-sga-principal

      - name: Esperar migraciones de Principal
        shell: bash
        run: |
          set -euo pipefail

          for intento in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              echo "Principal y Flyway disponibles"
              exit 0
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' sga-principal)" != "true" ]; then
              docker logs sga-principal
              exit 1
            fi

            sleep 2
          done

          docker logs sga-principal
          exit 1

      - name: Cargar datos sinteticos de Principal para E10
        shell: bash
        run: |
          set -euo pipefail

          docker cp \
            microservicio-docente/experimentos/seed_e10.sql \
            postgres-e10:/seed_e10.sql

          docker exec \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres-e10 \
            psql -v ON_ERROR_STOP=1 \
            -v e2e_docente_hash="$E2E_DOCENTE_HASH" \
            -U postgres \
            -d "$DB_NAME" \
            -f /seed_e10.sql

      - name: Verificar asignacion sintetica E10
        shell: bash
        run: |
          set -euo pipefail

          TOTAL="$(
            docker exec \
              -e PGPASSWORD="$DB_PASSWORD" \
              postgres-e10 \
              psql -At \
              -U postgres \
              -d "$DB_NAME" \
              -c "
                SELECT COUNT(*)
                FROM sga_principal.asignaciones
                WHERE id_asignacion = 900001
                  AND id_docente = 900001
                  AND activo = true;
              "
          )"

          echo "Asignaciones E10 encontradas: $TOTAL"

          if [ "$TOTAL" != "1" ]; then
            echo "::error::La asignacion sintetica E10 no fue cargada correctamente."
            exit 1
          fi

      - name: Levantar backend Docente
        shell: bash
        run: |
          docker run -d \
            --name microservicio-docente \
            --network e10-docente \
            -p 8081:8000 \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_NAME \
            -e DB_USER \
            -e DB_PASSWORD="$SGA_APP_PASSWORD" \
            -e SGA_APP_PASSWORD \
            -e GRPC_INTERNAL_TOKEN \
            -e SGA_PRINCIPAL_URL=http://sga-principal:8080 \
            -e SGA_PRINCIPAL_GRPC_HOST=sga-principal:9092 \
            e10-microservicio-docente

      - name: Preparar esquema y migraciones de Docente
        shell: bash
        run: |
          set -euo pipefail

          docker exec \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres-e10 \
            psql -v ON_ERROR_STOP=1 \
            -U postgres \
            -d "$DB_NAME" \
            -c "DROP SCHEMA IF EXISTS sga_docente CASCADE; CREATE SCHEMA sga_docente AUTHORIZATION sga_app;"

          docker exec microservicio-docente \
            python manage.py migrate --noinput

          docker exec \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres-e10 \
            psql -v ON_ERROR_STOP=1 \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c "
              GRANT USAGE ON SCHEMA sga_docente, sga_secretaria TO sga_app;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA sga_docente, sga_secretaria TO sga_app;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA sga_docente, sga_secretaria TO sga_app;
            "

      - name: Esperar backend Docente
        shell: bash
        run: |
          set -euo pipefail

          for intento in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8081/health > /dev/null; then
              echo "Docente disponible"
              exit 0
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' microservicio-docente)" != "true" ]; then
              docker logs microservicio-docente
              exit 1
            fi

            sleep 2
          done

          docker logs microservicio-docente
          exit 1

      - name: Cargar datos sinteticos de Docente para E10
        shell: bash
        run: |
          set -euo pipefail

          docker exec microservicio-docente python manage.py shell -c "
          from docentes.models import PeriodoEvaluacion, Actividad, Calificacion

          periodo = PeriodoEvaluacion.objects.create(
              id_ano_lectivo=900001,
              tipo='PRIMER_TRIMESTRE',
              nombre='Primer trimestre E10',
              fecha_inicio='2026-01-01',
              fecha_fin='2026-04-30',
              activo=True
          )

          actividad = Actividad.objects.create(
              id_asignacion=900001,
              id_periodo=periodo,
              tipo='TAREA',
              nombre='Actividad E10',
              descripcion='Actividad sintetica exclusiva de Playwright E10',
              fecha_entrega='2026-01-05',
              ponderacion=10,
              nota_maxima=10,
              es_sumativa=False
          )

          Calificacion.objects.create(
              id_actividad=actividad,
              id_matricula=900001,
              nota=8.50,
              nota_cualitativa='AAR',
              registrado_por=900001
          )

          print('Datos sinteticos de Docente E10 creados')
          "

          docker exec \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres-e10 \
            psql -v ON_ERROR_STOP=1 \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c "
              GRANT USAGE ON SCHEMA sga_docente, sga_secretaria TO sga_app;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA sga_docente, sga_secretaria TO sga_app;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA sga_docente, sga_secretaria TO sga_app;
            "

      - name: Levantar frontend Principal
        shell: bash
        run: |
          docker run -d \
            --name sga-frontend \
            --network e10-docente \
            -p 5173:5173 \
            -v "$PWD/sga-principal/sga-frontend:/app" \
            -v /app/node_modules \
            -w /app \
            node:20-alpine \
            sh -c "npm ci --no-audit && npm run dev -- --host 0.0.0.0"

      - name: Levantar frontend Docente
        shell: bash
        run: |
          docker run -d \
            --name docente-frontend \
            --network e10-docente \
            -p 3000:3000 \
            -v "$PWD/microservicio-docente/frontend:/app" \
            -v /app/node_modules \
            -w /app \
            node:20-alpine \
            sh -c "npm ci --no-audit && npm run dev -- --host 0.0.0.0 --port 3000"

      - name: Esperar sistema levantado
        shell: bash
        run: |
          esperar() {
            nombre="$1"
            url="$2"

            for intento in {1..60}; do
              if curl --fail --silent "$url" > /dev/null; then
                echo "$nombre disponible en $url"
                return 0
              fi
              sleep 2
            done

            echo "::error::$nombre no estuvo disponible en $url"
            docker ps -a
            docker logs sga-principal || true
            docker logs microservicio-docente || true
            docker logs sga-frontend || true
            docker logs docente-frontend || true
            return 1
          }

          esperar "Principal" "http://127.0.0.1:8080/actuator/health"
          esperar "Docente" "http://127.0.0.1:8081/health"
          esperar "Frontend Principal" "http://127.0.0.1:5173/login"
          esperar "Frontend Docente" "http://127.0.0.1:3000"

      - name: Ejecutar recorridos E2E
        working-directory: microservicio-docente/frontend
        run: npm run test:e2e

      - name: Subir informe Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-docente
          path: microservicio-docente/frontend/playwright-report/
          retention-days: 7

      - name: Subir resultados Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-docente
          path: microservicio-docente/frontend/test-results/
          retention-days: 7

  # ─── 4. JOB TEST-MOBILE ────────────────────────────────────────────────────
  test-mobile:
    name: 4. Pruebas Unitarias App Móvil
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar Pruebas Unitarias JVM de Android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          cd app-movil-docente
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon


  # ─── 5. JOB BUILD-IMAGES (GHCR) ────────────────────────────────────────────
  build-images:
    name: 5. Imagen GHCR (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-soporte-backend
      - test-secretaria-backend
      - test-web
      - lint
      - ci-docente
      - ci-movil-representante
      - test-mobile
      - e2e-docente
      - contract-openapi
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sga-principal
            context: sga-principal
            dockerfile: sga-principal/Dockerfile
          - image: microservicio-docente
            context: microservicio-docente
            dockerfile: microservicio-docente/Dockerfile
          - image: microservicio-secretaria
            context: microservicio-secretaria
            dockerfile: microservicio-secretaria/backend/Dockerfile
          - image: microservicio-soporte
            context: microservicio-soporte
            dockerfile: microservicio-soporte/backend/Dockerfile
          - image: microservicio-ia
            context: microservicio-ia
            dockerfile: microservicio-ia/Dockerfile
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticación en GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar tags de imagen
        id: image-tags
        env:
          IMAGE_MODULE: ${{ matrix.image }}
          PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          OWNER_LOWER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${OWNER_LOWER}/${IMAGE_MODULE}"
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${GITHUB_SHA}"
            if [ "$PUBLISH" = 'true' ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Construir imagen y publicar solo en main
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image-tags.outputs.tags }}


  # ─── 6. JOB BUILD-MOBILE-APK ───────────────────────────────────────────────
  build-mobile-apk:
    name: 6. Compilación de Paquete APK Android
    runs-on: ubuntu-latest
    needs: test-mobile
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar secretos de Release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SGA_RELEASE_STORE_PASSWORD: ${{ secrets.SGA_RELEASE_STORE_PASSWORD }}
          SGA_RELEASE_KEY_ALIAS: ${{ secrets.SGA_RELEASE_KEY_ALIAS }}
          SGA_RELEASE_KEY_PASSWORD: ${{ secrets.SGA_RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$SGA_RELEASE_STORE_PASSWORD"
          test -n "$SGA_RELEASE_KEY_ALIAS"
          test -n "$SGA_RELEASE_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"

      - name: Restaurar keystore de Release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/acadtrace-release.jks"
          test -s "$RUNNER_TEMP/acadtrace-release.jks"

      - name: Validar keystore PKCS12 reconstruido
        env:
          SGA_RELEASE_STORE_PASSWORD: ${{ secrets.SGA_RELEASE_STORE_PASSWORD }}
          SGA_RELEASE_KEY_ALIAS: ${{ secrets.SGA_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/acadtrace-release.jks"
          EXPECTED_SIZE=2782
          EXPECTED_SHA256="C076C5BDB2B017E8F2FC8F3AE5D1228B7B01331B032397EBBC2058DAC4DF9E9A"

          test -s "$KEYSTORE"
          ACTUAL_SIZE="$(stat -c '%s' "$KEYSTORE")"
          printf 'Tamaño del keystore: %s bytes\n' "$ACTUAL_SIZE"
          test "$ACTUAL_SIZE" -eq "$EXPECTED_SIZE"

          ACTUAL_SHA256="$(sha256sum "$KEYSTORE" | awk '{print toupper($1)}')"
          printf 'SHA-256 del keystore: %s\n' "$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$SGA_RELEASE_STORE_PASSWORD" \
            -alias "$SGA_RELEASE_KEY_ALIAS" \
            > /dev/null

      - name: Restaurar configuración Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app-movil-docente/app/google-services.json
          test -s app-movil-docente/app/google-services.json

      - name: Compilar APK y AAB Release firmados
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          SGA_RELEASE_STORE_FILE: ${{ runner.temp }}/acadtrace-release.jks
          SGA_RELEASE_STORE_PASSWORD: ${{ secrets.SGA_RELEASE_STORE_PASSWORD }}
          SGA_RELEASE_KEY_ALIAS: ${{ secrets.SGA_RELEASE_KEY_ALIAS }}
          SGA_RELEASE_KEY_PASSWORD: ${{ secrets.SGA_RELEASE_KEY_PASSWORD }}
        run: |
          cd app-movil-docente
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Verificar firma y calcular SHA-256
        run: |
          set -euo pipefail
          APK="app-movil-docente/app/build/outputs/apk/release/app-release.apk"
          AAB="app-movil-docente/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"

          sha256sum "$APK" "$AAB" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Subir paquete móvil Release firmado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-sha-${{ github.sha }}
          path: |
            app-movil-docente/app/build/outputs/apk/release/app-release.apk
            app-movil-docente/app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Validar versión del tag contra Android
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag de Release inválido: ${GITHUB_REF_NAME}. Se requiere vN.N.N."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app-movil-docente/app/build.gradle.kts)"

          test -n "$APP_VERSION"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "El tag v${TAG_VERSION} no coincide con versionName ${APP_VERSION}."
            exit 1
          fi

          echo "Versión validada: ${APP_VERSION}"

      - name: Publicar APK y AAB verificados en GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app-movil-docente/app/build/outputs/apk/release/app-release.apk"
          AAB="app-movil-docente/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"
          test -s SHA256SUMS.txt

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$APK#app-release.apk" \
              "$AAB#app-release.aab" \
              "SHA256SUMS.txt#SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$APK#app-release.apk" \
              "$AAB#app-release.aab" \
              "SHA256SUMS.txt#SHA256SUMS.txt" \
              --target "$GITHUB_SHA" \
              --title "AcadTrace $GITHUB_REF_NAME" \
              --notes "Release móvil generado, firmado, verificado y publicado automáticamente por CI desde el commit $GITHUB_SHA."
          fi

  # ─── 7. JOB INTEGRATION & DEPLOY ───────────────────────────────────────────
  integration:
    name: 7. Integración y Despliegue en AWS EC2
    runs-on: ubuntu-latest
    needs:
      - build-images
      - build-mobile-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Despliegue Seguro por SSH a AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GRPC_INTERNAL_TOKEN: ${{ secrets.GRPC_INTERNAL_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GRPC_INTERNAL_TOKEN
          script: |
            cd ~/acadtrace || cd ~/sga-sistema-distribuido || git clone https://github.com/LEO23as/acadtrace.git ~/acadtrace
            cd ~/acadtrace || cd ~/sga-sistema-distribuido
            git fetch origin main
            git reset --hard origin/main
            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker image prune -f
            
            echo "==> Iniciando sondas de salud posterior al arranque (Criterio E15)..."
            sleep 15
            
            check_health() {
              local url=$1
              local name=$2
              echo "Verificando $name en $url..."
              # Aumentamos a 30 intentos (150 segundos) porque AWS EC2 puede ser lento para iniciar Java
              for i in {1..60}; do
                HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $url)
                if [ "$HTTP_STATUS" = "200" ]; then
                  echo "$name esta SANO (HTTP 200)."
                  return 0
                fi
                sleep 5
              done
              echo "ERROR: $name NUNCA REPORTO SALUD (Fallo el despliegue)"
              docker compose logs "$name"
              return 1
            }
            
            check_health "http://localhost:8080/actuator/health" "sga-principal" || exit 1
            check_health "http://localhost:5176/actuator/health" "microservicio-secretaria" || exit 1
            check_health "http://localhost:8083/actuator/health" "microservicio-soporte" || exit 1
            check_health "http://localhost:8081/health/" "microservicio-docente" || exit 1
            
            echo "==> Todos los contenedores reportaron salud exitosamente."
