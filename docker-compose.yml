version: '3.8'

services:
  # ─── 1. SGA PRINCIPAL (Java Spring Boot) ───
  sga-principal:
    build:
      context: ./sga-principal
      dockerfile: Dockerfile
    image: sga-principal:latest
    expose:
      - "8080"
      - "9092"
    environment:
      - DB_HOST=192.0.2.1
      - DB_PORT=5433
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - grpc.client.docente-service.address=static://microservicio-docente:9091
    networks:
      - sga-distribuido-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  # ─── 1b. HAPROXY (Load Balancer sga-principal) ───
  haproxy:
    image: haproxy:2.9-alpine
    container_name: sga-haproxy
    depends_on:
      - sga-principal
    ports:
      - "8080:8080"   # REST balanceado hacia las 2 replicas
      - "8081:8081"   # REST balanceado hacia las replicas de docente
      - "9092:9092"   # gRPC balanceado hacia las 2 replicas
      - "8404:8404"   # Panel de estadisticas HAProxy
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - sga-distribuido-net


  # ─── 2. MICROSERVICIO DOCENTE (Django + gRPC) ───
  microservicio-docente:
    build:
      context: ./microservicio-docente
      dockerfile: Dockerfile
    expose:
      - "8000"
      - "9091"
    environment:
      - DB_HOST=192.0.2.1
      - DB_PORT=5433
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - SGA_PRINCIPAL_GRPC_HOST=sga-principal:9092
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal
    volumes:
      - ./microservicio-docente/media:/app/media
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  spark:
    image: apache/spark:3.5.1
    container_name: sga-spark
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8090:8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
    volumes:
      - ./scripts/spark:/scripts
      - ./scripts/spark/jars:/jars
    networks:
      - sga-distribuido-net

  # ─── 3. MICROSERVICIO SECRETARÍA ───
  microservicio-secretaria:
    build:
      context: ./microservicio-secretaria
      dockerfile: backend/Dockerfile
    container_name: microservicio-secretaria
    ports:
      - "8082:5176"   # REST Backend (server.port real del jar es 5176, ver application.properties)
    environment:
      - DB_HOST=192.0.2.1
      - DB_PORT=5433
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - JWT_SECRET=***REMOVED***
      - AES_SECRET_KEY=***REMOVED-AES-SECRET***=
      - GRPC_PRINCIPAL_HOST=sga-principal
      - GRPC_PRINCIPAL_PORT=9092
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal

  # ─── 4. MICROSERVICIO SOPORTE ───
  microservicio-soporte:
    build:
      context: ./microservicio-soporte/backend
      dockerfile: Dockerfile
    container_name: microservicio-soporte
    ports:
      - "8083:5178"   # REST Backend (server.port real del jar es 5178, ver application.properties)
    environment:
      - DB_HOST=192.0.2.1
      - DB_PORT=5433
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - JWT_SECRET=***REMOVED***
      - PRINCIPAL_GRPC_HOST=sga-principal
      - PRINCIPAL_GRPC_PORT=9092
      - ETCD_ENDPOINTS=http://etcd:2379
    networks:
      - sga-distribuido-net
    depends_on:
      - etcd

  # ─── 4b. ETCD (coordinacion / eleccion de lider entre replicas de soporte) ───
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    networks:
      - sga-distribuido-net

  # ─── 5. FRONTEND SGA (React + Vite) ───
  sga-frontend:
    image: node:20-alpine
    container_name: sga-frontend
    working_dir: /app
    volumes:
      - ./sga-principal/sga-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal

  # ─── 6. FRONTEND DOCENTE (React + Vite) ───
  docente-frontend:
    image: node:20-alpine
    container_name: docente-frontend
    working_dir: /app
    volumes:
      - ./microservicio-docente/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    networks:
      - sga-distribuido-net
    depends_on:
      - microservicio-docente

  # ─── 7. PROMETHEUS (observabilidad: scrapea los 4 servicios) ───
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sga-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal
      - microservicio-docente
      - microservicio-secretaria
      - microservicio-soporte

  # ─── 8. GRAFANA (dashboards sobre las metricas de Prometheus) ───
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sga-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=***REMOVED-GRAFANA-SECRET***
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - sga-distribuido-net
    depends_on:
      - prometheus

networks:
  sga-distribuido-net:
    driver: bridge
