version: '3.8'
services:
  postgres:
    image: postgres:17
    container_name: sga-soporte-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sga_soporte
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  sga-soporte:
    build: .
    container_name: sga-soporte-app
    ports:
      - "8081:8081"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres

volumes:
  pgdata:
