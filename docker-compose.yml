version: '3.8'

services:
  # Base de Datos PostgreSQL 15
  sga-db:
    image: postgres:15-alpine
    container_name: sga-db
    environment:
      POSTGRES_DB: sga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ***REMOVED***
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sga-distribuido-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sga"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SGA Principal (Replica 1)
  sga-principal-1:
    build:
      context: ./sga-principal
      dockerfile: Dockerfile
    container_name: sga-principal-1
    environment:
      - DB_HOST=sga-db
      - DB_PORT=5432
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    volumes:
      - sga_uploads:/app/uploads
    depends_on:
      sga-db:
        condition: service_healthy
    networks:
      - sga-distribuido-net

  # SGA Principal (Replica 2)
  sga-principal-2:
    build:
      context: ./sga-principal
      dockerfile: Dockerfile
    container_name: sga-principal-2
    environment:
      - DB_HOST=sga-db
      - DB_PORT=5432
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    volumes:
      - sga_uploads:/app/uploads
    depends_on:
      sga-db:
        condition: service_healthy
    networks:
      - sga-distribuido-net

  # HAProxy Load Balancer
  haproxy:
    image: haproxy:2.9-alpine
    container_name: sga-haproxy
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080" # REST Proxy
      - "8081:8081" # Docente REST Proxy
      - "9092:9092" # gRPC Proxy
      - "8404:8404" # Stats Dashboard
    depends_on:
      - sga-principal-1
      - sga-principal-2
    networks:
      - sga-distribuido-net

  # Microservicio Docente (Django + gRPC)
  microservicio-docente:
    build:
      context: ./microservicio-docente
      dockerfile: Dockerfile
    container_name: microservicio-docente
    environment:
      - DB_HOST=sga-db
      - DB_PORT=5432
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
    ports:
      - "9091:9091" # gRPC Server
    depends_on:
      sga-db:
        condition: service_healthy
    networks:
      - sga-distribuido-net

  # Microservicio Secretaría (Spring Boot)
  microservicio-secretaria:
    build:
      context: ./microservicio-secretaria
      dockerfile: backend/Dockerfile
    container_name: microservicio-secretaria
    environment:
      - DB_HOST=sga-db
      - DB_PORT=5432
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - SGA_PRINCIPAL_GRPC_HOST=haproxy
      - SGA_PRINCIPAL_GRPC_PORT=9092
    ports:
      - "8082:8082"
    depends_on:
      sga-db:
        condition: service_healthy
      haproxy:
        condition: service_started
    networks:
      - sga-distribuido-net

  # ETCD Leader Election Service
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - "2379:2379"
    networks:
      - sga-distribuido-net

  # Microservicio Soporte (Spring Boot + ETCD)
  microservicio-soporte:
    build:
      context: ./microservicio-soporte
      dockerfile: backend/Dockerfile
    container_name: microservicio-soporte
    environment:
      - DB_HOST=sga-db
      - DB_PORT=5432
      - DB_NAME=sga
      - DB_USER=postgres
      - DB_PASSWORD=***REMOVED***
      - ETCD_ENDPOINTS=http://etcd:2379
    ports:
      - "8083:8083"
    depends_on:
      sga-db:
        condition: service_healthy
      etcd:
        condition: service_started
    networks:
      - sga-distribuido-net

  # SGA Frontend (React + Vite)
  sga-frontend:
    image: node:20-alpine
    container_name: sga-frontend
    working_dir: /app
    volumes:
      - ./sga-principal/sga-frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - haproxy
    networks:
      - sga-distribuido-net

  # Apache Spark Master Cluster
  sga-spark:
    image: apache/spark:3.5.1
    container_name: sga-spark
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8090:8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
    networks:
      - sga-distribuido-net

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sga-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - sga-distribuido-net

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sga-grafana
    ports:
      - "3001:3000"
    networks:
      - sga-distribuido-net

volumes:
  pgdata:
  sga_uploads:

networks:
  sga-distribuido-net:
    driver: bridge
