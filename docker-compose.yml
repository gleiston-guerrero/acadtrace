version: '3.8'

services:
  # ─── 1. SGA PRINCIPAL (Java Spring Boot) ───
  sga-principal:
    build:
      context: ./sga-principal
      dockerfile: Dockerfile
    image: sga-principal:latest
    expose:
      - "8080"
      - "9092"
    environment:
      - DB_HOST=${DB_HOST:-192.0.2.1}
      - DB_PORT=${DB_PORT:-5433}
      - DB_NAME=${DB_NAME:-sga}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - AUDIT=${AUDIT:-m2}
      - JWT_SECRET=${JWT_SECRET}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - GRPC_INTERNAL_TOKEN=${GRPC_INTERNAL_TOKEN}
      - FCM_ENABLED=${FCM_ENABLED:-false}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - grpc.client.docente-service.address=static://microservicio-docente:9091
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false


    volumes:
      - ./sga-principal/uploads:/app/uploads
      - ${FIREBASE_CREDENTIALS_PATH:-/home/ubuntu/.secrets/acadtrace/firebase-admin.json}:/run/secrets/firebase-admin.json:ro

    networks:
      - sga-distribuido-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  # ─── 1b. HAPROXY (Load Balancer sga-principal) ───
  haproxy:
    image: haproxy:2.9-alpine
    container_name: sga-haproxy
    depends_on:
      - sga-principal
      - microservicio-secretaria
    ports:
      - "8080:8080"   # REST balanceado hacia las 2 replicas
      - "8081:8081"   # REST balanceado hacia las replicas de docente
      - "8082:8082"   # REST balanceado hacia microservicio-secretaria
      - "9092:9092"   # gRPC balanceado hacia las 2 replicas
      - "8404:8404"   # Panel de estadisticas HAProxy
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - sga-distribuido-net

  # ─── 2. MICROSERVICIO DOCENTE (Django + gRPC) ───
  microservicio-docente:
    build:
      context: ./microservicio-docente
      dockerfile: Dockerfile
    expose:
      - "8000"
      - "9091"
    environment:
      - DB_HOST=${DB_HOST:-192.0.2.1}
      - DB_PORT=${DB_PORT:-5433}
      - DB_NAME=${DB_NAME:-sga}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - AUDIT=${AUDIT:-m2}
      - GRPC_INTERNAL_TOKEN=${GRPC_INTERNAL_TOKEN}
      - SGA_PRINCIPAL_URL=http://sga-principal:8080
      - SGA_PRINCIPAL_GRPC_HOST=sga-principal:9092
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal
    volumes:
      - ./microservicio-docente/media:/app/media
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  spark:
    image: apache/spark:3.5.1
    container_name: sga-spark
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "7077:7077"
      - "8090:8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - DB_HOST=${DB_HOST:-192.0.2.1}
      - DB_PORT=${DB_PORT:-5433}
      - DB_NAME=${DB_NAME:-sga}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./scripts/spark:/scripts
      - ./scripts/spark/jars:/jars
    networks:
      - sga-distribuido-net

  # ─── 3. MICROSERVICIO SECRETARÍA ───
  microservicio-secretaria:
    build:
      context: ./microservicio-secretaria
      dockerfile: backend/Dockerfile
    container_name: microservicio-secretaria
    ports:
      - "5176:5176"   # REST & Frontend integrado en Spring Boot
      # - "8082:5176"  # REST Backend alias compatible
    environment:
      - DB_HOST=${DB_HOST:-192.0.2.1}
      - DB_PORT=${DB_PORT:-5433}
      - DB_NAME=${DB_NAME:-sga}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - AUDIT=${AUDIT:-m2}
      - JWT_SECRET=${JWT_SECRET}
      - AES_SECRET_KEY=${AES_SECRET_KEY}
      - GRPC_INTERNAL_TOKEN=${GRPC_INTERNAL_TOKEN}
      - GRPC_PRINCIPAL_HOST=sga-principal
      - GRPC_PRINCIPAL_PORT=9092
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal

  # ─── 4. MICROSERVICIO SOPORTE ───
  microservicio-soporte:
    build:
      context: ./microservicio-soporte
      dockerfile: backend/Dockerfile
    container_name: microservicio-soporte
    ports:
      - "8083:5178"   # REST Backend (server.port real del jar es 5178, ver application.properties)
      - "9094:9094"   # gRPC Servidor (IncidenciaService)
    environment:
      - DB_HOST=${DB_HOST:-192.0.2.1}
      - DB_PORT=${DB_PORT:-5433}
      - DB_NAME=${DB_NAME:-sga}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GRPC_INTERNAL_TOKEN=${GRPC_INTERNAL_TOKEN}
      - PRINCIPAL_GRPC_HOST=sga-principal
      - PRINCIPAL_GRPC_PORT=9092
      - GRPC_PORT=9094
      - ETCD_ENDPOINTS=http://etcd:2379
      - ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    networks:
      - sga-distribuido-net
    depends_on:
      - etcd

  zipkin:
    image: openzipkin/zipkin:2.24.3
    container_name: sga-zipkin
    ports:
      - "9411:9411"
    networks:
      - sga-distribuido-net

  # ─── 4b. ETCD (coordinacion / eleccion de lider entre replicas de soporte) ───
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    networks:
      - sga-distribuido-net

  # ─── 5. FRONTEND SGA (React + Vite) ───
  sga-frontend:
    image: node:20-alpine
    container_name: sga-frontend
    working_dir: /app
    volumes:
      - ./sga-principal/sga-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal

  # ─── 6. FRONTEND DOCENTE (React + Vite) ───
  docente-frontend:
    image: node:20-alpine
    container_name: docente-frontend
    working_dir: /app
    volumes:
      - ./microservicio-docente/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    networks:
      - sga-distribuido-net
    depends_on:
      - microservicio-docente

  # ─── 7. PROMETHEUS (observabilidad: scrapea los 4 servicios) ───
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sga-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sga-distribuido-net
    depends_on:
      - sga-principal
      - microservicio-docente
      - microservicio-secretaria
      - microservicio-soporte

  # ─── 8. GRAFANA (dashboards sobre las metricas de Prometheus) ───
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sga-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD debe definirse}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - sga-distribuido-net
    depends_on:
      - prometheus

  # ─── 6. MICROSERVICIO IA (Python FastAPI - Google Gemini 1.5 Flash) ───
  microservicio-ia:
    build:
      context: ./microservicio-ia
      dockerfile: Dockerfile
    image: microservicio-ia:latest
    container_name: microservicio-ia
    expose:
      - "8084"
    ports:
      - "8084:8084"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - sga-distribuido-net
    restart: unless-stopped

  # ─── 7. CADVISOR (métricas de CPU/RAM por contenedor) ───
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sga-cadvisor
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - sga-distribuido-net
    restart: unless-stopped

  # ─── POSTGRES EXPORTER (métricas de disponibilidad de PostgreSQL) ───
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sga-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@${DB_HOST:-192.0.2.1}:${DB_PORT:-5433}/${DB_NAME:-sga}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - sga-distribuido-net
    restart: unless-stopped

networks:
  sga-distribuido-net:
    driver: bridge

volumes:
  sga_uploads:
