# Servidor
server.port=8080
spring.application.name=sga-principal

# Base de datos Supabase (puerto 6543 = pooler transaccional, soporta muchos clientes;
# el 5432 es session mode y solo permite 15 conexiones para TODO el proyecto Supabase)
# Base de datos — Postgres en Docker sobre EC2 (IP elástica, no cambia)
spring.datasource.url=jdbc:postgresql://${DB_HOST:192.0.2.1}:${DB_PORT:5433}/${DB_NAME:sga}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:E46_REMOVED_CREDENTIAL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4


# Flyway
# El esquema hasta V8 (carpeta sql/, aplicada a mano contra la base viva) se
# marca como "baseline": Flyway no la vuelve a correr, solo empieza a
# gestionar y versionar las migraciones nuevas desde V9 en adelante.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8
spring.flyway.baseline-description=Esquema hasta V8 (aplicado a mano antes de integrar Flyway)
spring.flyway.schemas=sga_principal
spring.flyway.locations=classpath:db/migration

# JPA
spring.devtools.restart.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.default_schema=sga_principal
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# JWT
jwt.secret=E46_REMOVED_CREDENTIAL
jwt.expiration=86400000
# CORREO (Gmail con 2FA - usar contraseña de aplicación)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kbedonv@uteq.edu.ec
spring.mail.password=E46_REMOVED_CREDENTIAL
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


logging.level.org.springframework.security=DEBUG

# Configuración de subida de archivos (hasta 10 MB por foto)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# gRPC cliente hacia MICRO-DOCENTE (reemplaza el antiguo XML-RPC, solo usado en una presentación anterior)
# MICRO-DOCENTE debe levantar su servidor gRPC en este mismo puerto usando docente.proto
grpc.client.docente-service.address=static://localhost:9091
grpc.client.docente-service.negotiationType=PLAINTEXT

# gRPC servidor propio - aquí se conectan Secretaría, Soporte, etc. usando principal.proto
grpc.server.port=9092
# Desactiva la seguridad propia de gRPC (usamos la comunicación interna sin JWT por ahora)
spring.autoconfigure.exclude=net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

# Actuator - endpoints para HAProxy health check y Prometheus scraping
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.probes.enabled=true
