spring.application.name=sga-soporte-backend
server.port=${PORT:5178}

# --- Base de datos (usada por DataSourceConfig para armar la URL JDBC) ---
db.host=${DB_HOST}
db.port=${DB_PORT:5432}
db.name=${DB_NAME}
db.user=${DB_USER}
db.password=${DB_PASSWORD}
db.ssl=${DB_SSL:false}

# --- JWT (mismo secret que sga-principal) ---
app.jwt.secret=${JWT_SECRET}

# --- CORS ---
app.cors.origin=${CORS_ORIGIN:*}

# --- sga-principal via gRPC (host/puerto donde corre su servidor gRPC) ---
principal.grpc.host=${PRINCIPAL_GRPC_HOST:localhost}
principal.grpc.port=${PRINCIPAL_GRPC_PORT:9092}

# --- Servidor gRPC propio (IncidenciaService): puerto donde sga-principal,
# sga-docente y sga-secretaria reportan sus fallas como tickets ---
grpc.server.port=${GRPC_PORT:9094}

# --- Frontend estatico (dist), relativo al working directory del proceso ---
# (el working directory se fija en la raiz del repo, ver spring-boot-maven-plugin en pom.xml)
app.frontend.dist-path=${FRONTEND_DIST_PATH:dist}

# --- etcd (eleccion de lider entre replicas, ver LeaderElectionService) ---
etcd.endpoints=${ETCD_ENDPOINTS:http://localhost:2379}
etcd.election.name=/sga/leader
etcd.lease.ttl-seconds=${ETCD_LEASE_TTL:5}
# Identificador de esta instancia dentro de la eleccion. En Docker, HOSTNAME
# ya es el id del contenedor (unico por replica); en local cae a un uuid.
app.instance.id=${HOSTNAME:}

# --- Tareas programadas (solo corren en la replica lider, ver LeaderElectionService) ---
scheduling.cierre-automatico.fixed-delay-ms=${CIERRE_AUTOMATICO_INTERVAL_MS:3600000}
scheduling.cierre-automatico.dias-inactividad=${CIERRE_AUTOMATICO_DIAS:30}
scheduling.recordatorios.fixed-delay-ms=${RECORDATORIOS_INTERVAL_MS:3600000}

# --- Jackson: fechas como ISO-8601, no timestamps epoch ---
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.ec.uteq.sga.soporte=DEBUG

# Actuator - endpoints para Prometheus scraping y health checks
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name:sga-soporte}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration