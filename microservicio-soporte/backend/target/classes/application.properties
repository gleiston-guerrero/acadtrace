spring.application.name=sga-soporte-backend
server.port=${PORT:5178}

# --- Base de datos (usada por DataSourceConfig para armar la URL JDBC) ---
db.host=${DB_HOST}
db.port=${DB_PORT:5432}
db.name=${DB_NAME}
db.user=${DB_USER}
db.password=${DB_PASSWORD}
db.ssl=${DB_SSL:false}

# --- JWT (mismo secret que sga-principal) ---
app.jwt.secret=${JWT_SECRET}

# --- CORS ---
app.cors.origin=${CORS_ORIGIN:*}

# --- sga-principal via gRPC (host/puerto donde corre su servidor gRPC) ---
principal.grpc.host=${PRINCIPAL_GRPC_HOST:localhost}
principal.grpc.port=${PRINCIPAL_GRPC_PORT:9092}

# --- Frontend estatico (dist), relativo al working directory del proceso ---
# (el working directory se fija en la raiz del repo, ver spring-boot-maven-plugin en pom.xml)
app.frontend.dist-path=${FRONTEND_DIST_PATH:dist}

# --- Jackson: fechas como ISO-8601, no timestamps epoch ---
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.ec.uteq.sga.soporte=DEBUG
